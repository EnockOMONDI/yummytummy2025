{% extends 'jet/base.html' %}
{% load static %}

{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'yummytummy_store/css/jet-custom.css' %}">
    <link rel="shortcut icon" href="{% static 'yummytummy_store/img/favicon.ico' %}">
{% endblock %}

{% block branding %}
    <div class="branding">
        <a href="{% url 'admin:index' %}">
            <img src="{% static 'yummytummy_store/img/logo.svg' %}" alt="YummyTummy" class="branding-logo">
            <span>{{ site_header|default:_('Django administration') }}</span>
        </a>
    </div>
{% endblock %}
