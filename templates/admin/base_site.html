{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" type="text/css" href="{% static 'yummytummy_store/css/jet-custom.css' %}">
{% endblock %}

{% block title %}{{ title }} | {{ site_title|default:_('YummyTummy Admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <img src="{% static 'yummytummy_store/img/yummytummylogo.png' %}" alt="YummyTummy" class="branding-logo">
        YummyTummy Administration
    </a>
</h1>
{% endblock %}
