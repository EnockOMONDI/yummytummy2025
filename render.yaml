databases:
  - name: yummytummy-db
    databaseName: yummytummy_db
    user: yummytummy_user
    plan: free

services:
  - type: web
    name: yummytummy-store
    runtime: python3
    plan: free
    branch: yummy2
    buildCommand: "./build.sh"
    startCommand: "gunicorn yummytummy_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yummytummy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: yummytummy_project.settings
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://yummytummy.co.ke,https://www.yummytummy.co.ke"
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SECURE_PROXY_SSL_HEADER
        value: "HTTP_X_FORWARDED_PROTO,https"
