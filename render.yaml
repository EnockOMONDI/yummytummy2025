databases:
  - name: yummytummy-db
    databaseName: yummytummy_db
    user: yummytummy_user
    plan: free

services:
  - type: web
    name: yummytummy-store
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn yummytummy_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yummytummy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: yummytummy_project.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_PROXY_SSL_HEADER
        value: "HTTP_X_FORWARDED_PROTO,https"
      # Email Configuration
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "dedeexpeditions@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "roqu frlt wvof rqxk"
      - key: DEFAULT_FROM_EMAIL
        value: "YummyTummy Store <dedeexpeditions@gmail.com>"
      # Uploadcare Configuration
      - key: UPLOADCARE_PUBLIC_KEY
        value: "1528b06f591935e6491d"
      - key: UPLOADCARE_SECRET_KEY
        value: "d3980def5fa035e7eed2"
